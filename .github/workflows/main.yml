- name: Download Sniper Script
        env:
          SNIPER_URL: ${{ secrets.SNIPER_URL }}
        run: |
          # Strip surrounding whitespace or quotes
          CLEAN_URL=$(echo "$SNIPER_URL" | tr -d '\r\n"' | xargs)
          curl -fL --retry 3 "$CLEAN_URL" -o sniper.py
          head -n 5 sniper.py

      - name: Run Sniper
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          GRABROOM_URL: ${{ secrets.GRABROOM_URL }}
        run: python3 sniper.py
        
