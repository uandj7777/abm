name: BMS Seat Sniper

on:
  workflow_dispatch:

jobs:
  snipe:
    runs-on: ubuntu-latest
    steps:
      - name: Native Git Checkout
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.TOKEN_GITHUB }}@github.com/${{ github.repository }}.git" .

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install curl_cffi requests

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Fresh Sniper Script from Gist
        env:
          SNIPER_URL: ${{ secrets.SNIPER_URL }}
        run: |
          # Remove any stale local file from the clone
          rm -f sniper.py

          # Clean secret URL and bust GitHub's 5-minute CDN cache
          CLEAN_URL=$(echo "$SNIPER_URL" | tr -d '\r\n"' | xargs)
          curl -fL --retry 3 "${CLEAN_URL}?ts=$(date +%s)" -o sniper.py

          echo "=== VERIFYING start_warp() IN DOWNLOADED SCRIPT ==="
          grep -A 8 "def start_warp" sniper.py
          echo "==================================================="

      - name: Run Sniper
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          GRABROOM_URL: ${{ secrets.GRABROOM_URL }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 -u sniper.py
